name: crawl-news-sns

# 뉴스/SNS 수집 파이프라인을 GitHub Actions 에서 주기 실행합니다.
# 공개 저장소이므로 표준 러너 사용량은 무료입니다.
#
# 잡 구성
#
#   collect ──> analyze (4대 병렬) ──> finish      뉴스: 수집 -> 관계 분석 -> 집계·화제성
#   sns                                           유튜브 화제성 (뉴스와 무관, 처음부터 병렬)
#   bills                                         공동발의 (뉴스와 무관, 처음부터 병렬)
#
# 예전에는 한 러너에서 뉴스 -> SNS -> 법안을 차례로 돌았습니다. 뉴스가 많은
# 날에는 NLI 계산이 러너 한 대(vCPU 4개)의 90분 예산을 넘겼습니다.
# 2026-09-15, 09-16 두 회차는 예산에 걸려 300건 중 215건, 176건만 분석했고,
# SNS 는 그 뒤에서 100분을 기다렸습니다. 러너가 느려서가 아니었습니다(둘 다
# AMD EPYC, AVX-512). 실제 창 길이(약 230토큰)에서 NLI 한 번이 코어 하나로
# 0.6초이고, 창 하나에 4번, 쌍 하나에 창 최대 8개, 기사 하나에 쌍 최대 66개를
# 부릅니다. 계산량 자체가 러너 한 대의 몫을 넘은 것입니다.
#
# 그래서 분석을 러너 네 대로 나눕니다. 러너 사이에는 기사 목록과 쌍 목록
# JSON 만 오갑니다. 분석 러너 하나가 죽어도 마무리는 돌고, 그 러너가 죽기
# 전까지 저장한 근거는 마무리가 DB 에서 찾아 함께 집계합니다.
on:
  schedule:
    - cron: "0 19 * * *" # 매일 04:00 KST (UTC 19:00)
  workflow_dispatch: # 수동 실행

concurrency:
  group: crawl-news-sns
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/backend
  PYTHONIOENCODING: utf-8
  POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
  POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
  PGSSLMODE: require # Supabase 등 관리형 Postgres 는 SSL 필수
  # 마무리 단계는 집계한 관계를 API 의 /api/edge 로 POST 합니다.
  # 배포된 백엔드 주소를 넣지 않으면 localhost 로 붙어 실패합니다.
  API_BASE_URL: ${{ secrets.API_BASE_URL }}
  # POST /api/edge 는 인증을 요구한다. Render 의 API_WRITE_TOKEN 과 같은 값.
  API_WRITE_TOKEN: ${{ secrets.API_WRITE_TOKEN }}
  # 커넥션 한도가 낮은 무료 DB 를 보호한다. 잡마다 이만큼 쓰므로 동시에
  # 도는 잡(분석 4 + SNS 1)을 합치면 최대 15개다. Supavisor 트랜잭션 풀러를
  # 거치므로 DB 에 직접 붙는 수는 이보다 적다.
  DB_POOL_MAX_SIZE: "3"
  # 분석 러너 수. 아래 analyze 잡의 matrix 와 같아야 한다.
  NEWS_SHARDS: "4"

jobs:
  # --- 뉴스 1: 수집 ----------------------------------------------------------
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      base_date: ${{ steps.collect.outputs.base_date }}
      since: ${{ steps.collect.outputs.since }}
      articles: ${{ steps.collect.outputs.articles }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-crawler.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-crawler.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      # 섹션 목록과 의원 296명 검색. DB 에 쓰지 않는다. 수집 0건이면 실패로
      # 끝난다. 네이버 마크업이 바뀌었을 때 조용히 지나가지 않게 하려는 것이다.
      - name: Collect articles
        id: collect
        timeout-minutes: 40
        env:
          NEWS_COLLECT_BUDGET_SEC: "1800"
        run: python backend/crawlers/news_crawler_pipeline.py collect --out articles.json

      - uses: actions/upload-artifact@v6
        with:
          name: articles
          path: articles.json
          retention-days: 7

  # --- 뉴스 2: 관계 분석 (병렬) ----------------------------------------------
  analyze:
    needs: collect
    runs-on: ubuntu-latest
    # 러너 하나가 실패해도 나머지는 끝까지 돈다. 마무리가 있는 만큼 집계한다.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    timeout-minutes: 90
    env:
      # 러너 한 대가 기사 75건을 맡는다. 뉴스가 많았던 09-16 을 기준으로 잡으면
      # 러너당 약 35분 걸린다. 예산은 그 두 배 가까이 준다.
      #
      # 지켜야 하는 식: 예산(60분) + 유예(1분) + 결과 파일 쓰기 < 스텝 한도(70분).
      # 예산을 넘기면 남은 기사를 버리고, 돌고 있는 워커는 유예만큼만 기다린다.
      NEWS_TIME_BUDGET_SEC: "3600"
    steps:
      # 러너 기계를 남긴다. 느린 회차가 오면 이 출력과 [느린 기사] 줄을 나란히
      # 본다. torch 의 빠른 경로는 벡터 확장 명령어(AVX2/AVX-512/AMX)에 기댄다.
      # 09-15, 09-16 은 이 출력 덕분에 러너 탓이 아니라는 걸 확인했다.
      - name: Runner hardware
        run: |
          lscpu | grep -E '^(Model name|CPU\(s\)|Thread\(s\) per core|Hypervisor vendor)' || true
          echo "vector extensions: $(grep -o -w -E 'avx2|avx512f|avx512_vnni|amx_tile' /proc/cpuinfo | sort -u | tr '\n' ' ')"
          echo "nproc: $(nproc)"
          free -h

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-crawler.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-crawler.txt

      # NLI 모델(약 550MB)을 러너마다 허깅페이스에서 받으면 네 대가 동시에
      # 비인증 요청을 보내 받기가 막힐 수 있다. 한 번 받아 캐시에 둔다.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: hf-MoritzLaurer-mDeBERTa-v3-base-mnli-xnli

      - uses: actions/download-artifact@v7
        with:
          name: articles

      - name: Analyze shard ${{ matrix.shard }}
        timeout-minutes: 70
        run: >-
          python backend/crawlers/news_crawler_pipeline.py analyze
          --articles articles.json
          --shard ${{ matrix.shard }} --shards ${{ env.NEWS_SHARDS }}
          --out pairs-${{ matrix.shard }}.json

      # 분석 스텝이 실패해도 남긴다. 파일이 없으면 경고만 남고, 그 러너가
      # 저장한 근거는 마무리가 DB 에서 찾는다.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pairs-${{ matrix.shard }}
          path: pairs-${{ matrix.shard }}.json
          retention-days: 7

  # --- 뉴스 3: 마무리 --------------------------------------------------------
  finish:
    needs: [collect, analyze]
    # 분석 러너 일부가 실패해도 돈다. 수집 자체가 실패했으면 새 기사가 없으니
    # 돌 이유가 없다.
    if: always() && needs.collect.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-crawler.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-crawler.txt

      # 결과 파일이 하나도 없으면 이 스텝은 실패하지만 계속 간다.
      # 마무리 스크립트가 빈 디렉터리를 받아 DB 에서 쌍을 찾는다.
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: pairs-*
          path: pairs
          merge-multiple: true

      # 쌍별 근거 집계 -> API 로 엣지 게시 -> 뉴스 화제성 산출.
      # 실측 4분(09-14)~6.7분(09-15). API 가 잠들어 있으면 깨우는 데 1분이 더 든다.
      - name: Aggregate edges and attention
        timeout-minutes: 20
        run: >-
          python backend/crawlers/news_crawler_pipeline.py finish
          --pairs-dir pairs
          --shards ${{ env.NEWS_SHARDS }}
          --base-date "${{ needs.collect.outputs.base_date }}"
          --since "${{ needs.collect.outputs.since }}"

  # --- 유튜브 화제성 ---------------------------------------------------------
  sns:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      # 수집할 SNS 플랫폼. X/인스타그램은 비로그인 수집이 막혀 제외했다.
      # 로그인 세션을 붙일 수 있게 되면 "youtube,x,instagram" 으로 바꾼다.
      SNS_PLATFORMS: "youtube"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-crawler.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-crawler.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: SNS pipeline
        timeout-minutes: 40
        run: python backend/crawlers/sns_crawler_pipeline.py

  # --- 공동발의 --------------------------------------------------------------
  # 뉴스는 갈등만 싣고 협력은 싣지 않으므로(Galtung & Ruge 1965, Soroka 2006),
  # 협력의 증거는 뉴스 밖에서 가져온다. 자세한 내용은
  # docs/MEDIA_BIAS_RESEARCH.md 의 알고리즘 3. 키가 없으면 스크립트가 안내만
  # 남기고 끝난다.
  bills:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-crawler.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-crawler.txt

      - name: Assembly bills (co-sponsorship)
        timeout-minutes: 15
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: python backend/crawlers/assembly_bills_pipeline.py
