name: crawl-news-sns

# 뉴스/SNS 수집 파이프라인을 GitHub Actions 에서 주기 실행합니다.
# 공개 저장소이므로 표준 러너 사용량은 무료이며, 러너(16GB RAM)가
# Playwright 와 torch 를 무리 없이 감당합니다.
on:
  schedule:
    - cron: "0 19 * * *" # 매일 04:00 KST (UTC 19:00)
  workflow_dispatch: # 수동 실행

concurrency:
  group: crawl-news-sns
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      PYTHONIOENCODING: utf-8
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      PGSSLMODE: require # Supabase 등 관리형 Postgres 는 SSL 필수
      # 뉴스 파이프라인은 탐지한 관계를 API 의 /api/edge 로 POST 합니다.
      # 배포된 백엔드 주소를 넣지 않으면 localhost 로 붙어 실패합니다.
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      # POST /api/edge 는 인증을 요구한다. Render 의 API_WRITE_TOKEN 과 같은 값.
      API_WRITE_TOKEN: ${{ secrets.API_WRITE_TOKEN }}
      # 커넥션 한도가 낮은 무료 DB 를 보호한다.
      DB_POOL_MAX_SIZE: "3"
      # 수집할 SNS 플랫폼. X/인스타그램은 비로그인 수집이 막혀 제외했다.
      # 로그인 세션을 붙일 수 있게 되면 "youtube,x,instagram" 으로 바꾼다.
      SNS_PLATFORMS: "youtube"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-crawler.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-crawler.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      # run_news_sns.py 는 while True 데몬이라 스케줄 실행에 맞지 않습니다.
      # 동일한 두 파이프라인을 1회씩 직접 호출합니다.
      - name: News pipeline
        run: python backend/crawlers/news_crawler_pipeline.py

      - name: SNS pipeline
        if: always() # 뉴스 단계가 실패해도 SNS 는 시도
        run: python backend/crawlers/sns_crawler_pipeline.py

      # 공동발의 그래프. 뉴스는 갈등만 싣고 협력은 싣지 않으므로
      # (Galtung & Ruge 1965, Soroka 2006), 협력의 증거는 뉴스 밖에서
      # 가져온다. 자세한 내용은 docs/MEDIA_BIAS_RESEARCH.md 의 알고리즘 3.
      #
      # 법안은 매일 크게 바뀌지 않지만 수집이 가벼워(페이지 몇 번) 같이 돈다.
      # 키가 없으면 스크립트가 안내만 남기고 끝난다.
      - name: Assembly bills (co-sponsorship)
        if: always()
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: python backend/crawlers/assembly_bills_pipeline.py
