name: crawl-news-sns

# 뉴스/SNS 수집 파이프라인을 GitHub Actions 에서 주기 실행합니다.
# 공개 저장소이므로 표준 러너 사용량은 무료이며, 러너(16GB RAM)가
# Playwright 와 torch 를 무리 없이 감당합니다.
on:
  schedule:
    - cron: "0 19 * * *" # 매일 04:00 KST (UTC 19:00)
  workflow_dispatch: # 수동 실행

concurrency:
  group: crawl-news-sns
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 스텝별 한도의 합(110 + 40 + 15)에 준비 시간을 더한 값입니다.
    #
    # 90분이던 시절 2026-09-04 부터 09-09 까지 여섯 회차가 전부 이 한도에
    # 걸려 취소됐습니다. 뉴스 분석 루프 도중에 잘리니 그 뒤의 엣지 집계와
    # 화제성 산출이 실행되지 않아, 기사를 저장하고도 화면에는 아무것도
    # 반영되지 않았습니다(API last_updated 가 09-03 에 멈춤).
    #
    # 이 값은 안전망일 뿐입니다. 실제 종료 시점은 파이프라인이 스스로
    # 재는 NEWS_TIME_BUDGET_SEC 가 정합니다. 러너가 프로세스를 죽이면
    # 마무리 단계가 통째로 날아가지만, 파이프라인이 스스로 멈추면
    # 그때까지 분석한 만큼은 집계까지 마치고 화면에 나갑니다.
    timeout-minutes: 170
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      PYTHONIOENCODING: utf-8
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      PGSSLMODE: require # Supabase 등 관리형 Postgres 는 SSL 필수
      # 뉴스 파이프라인은 탐지한 관계를 API 의 /api/edge 로 POST 합니다.
      # 배포된 백엔드 주소를 넣지 않으면 localhost 로 붙어 실패합니다.
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      # POST /api/edge 는 인증을 요구한다. Render 의 API_WRITE_TOKEN 과 같은 값.
      API_WRITE_TOKEN: ${{ secrets.API_WRITE_TOKEN }}
      # 커넥션 한도가 낮은 무료 DB 를 보호한다.
      DB_POOL_MAX_SIZE: "3"
      # 수집할 SNS 플랫폼. X/인스타그램은 비로그인 수집이 막혀 제외했다.
      # 로그인 세션을 붙일 수 있게 되면 "youtube,x,instagram" 으로 바꾼다.
      SNS_PLATFORMS: "youtube"
      # 뉴스 파이프라인이 수집+분석에 쓸 시간. 이 시간을 넘기면 남은 기사를
      # 버리고 엣지 집계와 화제성 산출로 넘어간다. 아래 스텝 한도(110분)보다
      # 반드시 작아야 한다. 그래야 러너가 죽이기 전에 스스로 마무리한다.
      #
      # 지켜야 하는 식: 예산(90분) + 유예(1분) + 마무리(집계·화제성)
      # < 스텝 한도(110분). 마무리는 실측 4분(09-14, 예산 안에서 끝난 회차)과
      # 6.7분(09-15, 예산을 넘겨 끊긴 회차)이었다. 뒤쪽 기준으로 스텝이
      # 97.6분에 끝났으니 한도까지 여유는 12분쯤이다. 예산이나 유예를 늘릴
      # 때는 이 여유를 먼저 본다.
      #
      # 2026-09-13 회차는 예산을 넘긴 뒤에도 기사 한 건을 붙잡고 있는 워커를
      # 기다리다 110분에 걸려 죽었고, 그래서 마무리 단계가 실행되지 않았다.
      # 지금은 파이프라인이 돌고 있는 워커를 유예만큼만 기다리고 집계로
      # 넘어간다.
      NEWS_TIME_BUDGET_SEC: "5400"

    steps:
      # 러너 기계를 남긴다.
      #
      # 2026-09-15 수동 회차는 코어 수(4)가 같은데도 전날보다 NLI 가 쌍당
      # 10~17배 느렸다. 같은 기사, 같은 동시성에서였다. 스레드 설정과
      # 토크나이저는 따로 재서 원인에서 뺐지만, 로그에 CPU 모델이 없어 호스트
      # 탓인지는 확정하지 못했다. 다음에 느린 회차가 오면 이 출력과 뉴스
      # 로그의 [느린 기사] 줄을 나란히 본다. torch 의 빠른 경로는 벡터 확장
      # 명령어(AVX2/AVX-512/AMX)에 기대므로 그것도 함께 남긴다.
      - name: Runner hardware
        run: |
          lscpu | grep -E '^(Model name|CPU\(s\)|Thread\(s\) per core|Hypervisor vendor)' || true
          echo "vector extensions: $(grep -o -w -E 'avx2|avx512f|avx512_vnni|amx_tile' /proc/cpuinfo | sort -u | tr '\n' ' ')"
          echo "nproc: $(nproc)"
          free -h

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-crawler.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-crawler.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      # run_news_sns.py 는 while True 데몬이라 스케줄 실행에 맞지 않습니다.
      # 동일한 두 파이프라인을 1회씩 직접 호출합니다.
      #
      # 스텝마다 한도를 따로 둔다. 예전에는 job 한도 하나뿐이라 뉴스가
      # 늦어지면 SNS 와 법안 수집이 시작조차 못 했다. 실제로 09-04 이후
      # 회차에서 SNS 는 5분만 받고 같이 죽었고 법안은 아예 실행되지 않았다.
      - name: News pipeline
        timeout-minutes: 110
        run: python backend/crawlers/news_crawler_pipeline.py

      - name: SNS pipeline
        if: always() # 뉴스 단계가 실패해도 SNS 는 시도
        timeout-minutes: 40
        run: python backend/crawlers/sns_crawler_pipeline.py

      # 공동발의 그래프. 뉴스는 갈등만 싣고 협력은 싣지 않으므로
      # (Galtung & Ruge 1965, Soroka 2006), 협력의 증거는 뉴스 밖에서
      # 가져온다. 자세한 내용은 docs/MEDIA_BIAS_RESEARCH.md 의 알고리즘 3.
      #
      # 법안은 매일 크게 바뀌지 않지만 수집이 가벼워(페이지 몇 번) 같이 돈다.
      # 키가 없으면 스크립트가 안내만 남기고 끝난다.
      - name: Assembly bills (co-sponsorship)
        if: always()
        timeout-minutes: 15
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: python backend/crawlers/assembly_bills_pipeline.py
