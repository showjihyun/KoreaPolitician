version: '3.8'

services:
  # TuringDB - 고성능 그래프 데이터베이스
  turingdb:
    build:
      context: ./turingdb
      dockerfile: Dockerfile
    container_name: korea-politician-turingdb
    ports:
      - "6666:6666"  # TuringDB REST API
    volumes:
      - turingdb_data:/data
    restart: unless-stopped
    environment:
      - TURINGDB_DATA_DIR=/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6666/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app-network

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: korea-politician-backend
    ports:
      - "5000:5000"  # FastAPI Server
    volumes:
      - ./backend:/app
      - ./assembly_members_complete.json:/app/assembly_members_complete.json
      - ./img:/img:ro  # 이미지 폴더 마운트 (읽기 전용)
    environment:
      - TURINGDB_HOST=http://turingdb:6666
      - TURINGDB_GRAPH=korea_politician
      - PYTHONUNBUFFERED=1
    depends_on:
      turingdb:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn turingdb_server:app --host 0.0.0.0 --port 5000 --reload
    networks:
      - app-network

  # Neo4j (Legacy - 필요시 사용)
  neo4j:
    image: neo4j:5.15-community
    container_name: smallgo-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    restart: unless-stopped
    profiles:
      - legacy

networks:
  app-network:
    driver: bridge

volumes:
  turingdb_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins: 