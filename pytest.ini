[pytest]
# 저장소 루트에서 `pytest` 만 쳐도 돌게 한다.
#
# 예전에는 PYTHONPATH=backend 를 매번 앞에 붙여야 했고, 그마저도
# backend/tests 전체를 지정하면 수집 단계에서 깨졌다. neo4j_test.py 가
# py2neo 를 임포트하는데 그 패키지는 requirements 에 없다. Neo4j 를 쓰던
# 시절 스크립트이고 지금 파이프라인은 PostgreSQL 만 쓴다.
testpaths = backend/tests
pythonpath = backend
addopts = --ignore=backend/tests/neo4j_test.py

# 실제 PostgreSQL 이 필요한 테스트는 접속할 수 없으면 스스로 건너뛴다.
# 접속 정보는 POSTGRES_HOST / PORT / USER / PASSWORD / DB 환경변수로 준다.
