# Render 블루프린트 — API 서버(무료 플랜).
# 데이터베이스는 Supabase 무료 Postgres 를 사용하고 접속 정보만 주입합니다.
# (Render 자체 무료 Postgres 는 90일 후 만료되므로 쓰지 않습니다.)
services:
  - type: web
    name: korea-politician-api
    runtime: docker
    plan: free
    region: singapore # 한국에서 가장 가까운 무료 리전
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Supabase 대시보드 → Project Settings → Database 의 값으로 채웁니다.
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        sync: false
      # Supavisor 트랜잭션 풀러 포트. 직결(5432)이 아니라 6543 을 씁니다.
      # 무료 플랜은 직결 커넥션 수가 적고, API 는 요청마다 풀에서 커넥션을
      # 빌려 쓰므로 풀러 경유가 맞습니다.
      - key: POSTGRES_PORT
        value: "6543"
      # 관리형 Postgres 는 SSL 필수. libpq 가 이 값을 읽습니다.
      - key: PGSSLMODE
        value: require
      # 애플리케이션 커넥션 풀 크기. Render 무료(512MB)에 맞춘 값입니다.
      - key: DB_POOL_MAX_SIZE
        value: "5"
      # POST /api/edge 쓰기 인증 토큰. 설정하지 않으면 쓰기가 503 으로 막힙니다.
      # 크롤러(GitHub Actions)에도 같은 값을 시크릿으로 등록해야 합니다.
      - key: API_WRITE_TOKEN
        generateValue: true
      # 프론트엔드 출처만 허용하려면 지정합니다. 비우면 모든 출처 허용.
      - key: CORS_ALLOW_ORIGINS
        sync: false
